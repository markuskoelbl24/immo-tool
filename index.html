<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Objektrechner — Immobilien-Vergleich</title>
<style>
:root{
  --paper:#EDEFEA; --card:#F8F9F6; --card-2:#F1F3EE;
  --ink:#19201B; --ink-2:#4B554D; --ink-3:#7E877F;
  --rule:#D4D9CF; --rule-2:#BAC1B6;
  --accent:#14625A; --accent-ink:#0B3F39; --accent-soft:#DCE8E4;
  --good:#2E6B45; --good-bg:#DFEBE1;
  --warn:#8A6410; --warn-bg:#F1E8D0;
  --bad:#94382B;  --bad-bg:#F1DED9;
  --shadow:0 1px 2px rgba(25,32,27,.06),0 4px 14px rgba(25,32,27,.05);
  --serif:ui-serif,Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#141815; --card:#1C221E; --card-2:#232A25;
    --ink:#E6EAE5; --ink-2:#A6AFA7; --ink-3:#79837A;
    --rule:#2C332E; --rule-2:#3E463F;
    --accent:#5FC5B0; --accent-ink:#8FDDCB; --accent-soft:#1D302C;
    --good:#7FC194; --good-bg:#1A2B20;
    --warn:#D6AC55; --warn-bg:#2D2718;
    --bad:#E0897A;  --bad-bg:#2E1E1A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="light"]{
  --paper:#EDEFEA; --card:#F8F9F6; --card-2:#F1F3EE;
  --ink:#19201B; --ink-2:#4B554D; --ink-3:#7E877F;
  --rule:#D4D9CF; --rule-2:#BAC1B6;
  --accent:#14625A; --accent-ink:#0B3F39; --accent-soft:#DCE8E4;
  --good:#2E6B45; --good-bg:#DFEBE1;
  --warn:#8A6410; --warn-bg:#F1E8D0;
  --bad:#94382B;  --bad-bg:#F1DED9;
  --shadow:0 1px 2px rgba(25,32,27,.06),0 4px 14px rgba(25,32,27,.05);
}
:root[data-theme="dark"]{
  --paper:#141815; --card:#1C221E; --card-2:#232A25;
  --ink:#E6EAE5; --ink-2:#A6AFA7; --ink-3:#79837A;
  --rule:#2C332E; --rule-2:#3E463F;
  --accent:#5FC5B0; --accent-ink:#8FDDCB; --accent-soft:#1D302C;
  --good:#7FC194; --good-bg:#1A2B20;
  --warn:#D6AC55; --warn-bg:#2D2718;
  --bad:#E0897A;  --bad-bg:#2E1E1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.num,input[type=number],td.n,th.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--serif);font-weight:600;text-wrap:balance;margin:0}
h1{font-size:1.5rem;letter-spacing:-.01em}
h2{font-size:1.15rem}
h3{font-size:1rem}
.eyebrow{font-size:.68rem;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.wrap{max-width:1480px;margin:0 auto;padding:0 clamp(12px,3vw,28px)}
a{color:var(--accent)}

/* masthead */
header.mast{border-bottom:1px solid var(--rule);background:var(--card)}
.mast-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 0}
.mast-title{display:flex;flex-direction:column;gap:1px;margin-right:auto}
.mast-title .sub{font-size:.78rem;color:var(--ink-3)}
.mast-actions{display:flex;gap:8px;flex-wrap:wrap}

/* buttons */
button{font-family:inherit;font-size:.85rem;cursor:pointer;border-radius:5px;
  border:1px solid var(--rule-2);background:var(--card);color:var(--ink);padding:7px 12px;
  transition:background .12s,border-color .12s}
button:hover{background:var(--card-2);border-color:var(--ink-3)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,
[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* --paper flips with the theme and --accent flips the other way,
   so this single rule stays legible on both grounds. */
button.primary{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:600}
button.primary:hover{filter:brightness(1.08)}
button.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
button.ghost:hover{background:var(--card-2);color:var(--ink)}
button.danger{color:var(--bad);border-color:var(--rule-2)}
button.danger:hover{background:var(--bad-bg);border-color:var(--bad)}
button.tiny{padding:3px 8px;font-size:.75rem}

/* inputs */
input,select,textarea{font-family:inherit;font-size:.87rem;color:var(--ink);
  background:var(--card);border:1px solid var(--rule-2);border-radius:5px;padding:6px 8px;width:100%}
textarea{line-height:1.45;resize:vertical}
label.fld{display:flex;flex-direction:column;gap:3px;font-size:.72rem;color:var(--ink-2)}
label.fld > span{letter-spacing:.02em}

/* Rechenbasis strip */
.basis{position:sticky;top:0;z-index:40;background:var(--card);
  border-bottom:1px solid var(--rule);box-shadow:var(--shadow)}
.basis-in{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;padding:10px 0}
.knob{display:flex;flex-direction:column;gap:2px;min-width:88px}
.knob label{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.knob .row{display:flex;align-items:center;gap:4px}
.knob input{width:70px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;padding:5px 6px}
.knob .unit{font-size:.75rem;color:var(--ink-3)}
.basis .sep{width:1px;align-self:stretch;background:var(--rule);margin:2px 2px}

/* layout */
main{padding:20px 0 60px}
.cols{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:1120px){.cols{grid-template-columns:300px 1fr;align-items:start}}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadow)}
.panel-hd{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--rule)}
.panel-hd h2,.panel-hd h3{margin-right:auto}
.panel-bd{padding:14px}
.rail{position:sticky;top:74px;display:flex;flex-direction:column;gap:14px}
@media(max-width:1119px){.rail{position:static}}

/* profile grid */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px}

/* stat rows */
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:5px 0;border-bottom:1px dotted var(--rule)}
.stat:last-child{border-bottom:0}
.stat .k{font-size:.78rem;color:var(--ink-2)}
.stat .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.86rem;font-weight:600;text-align:right}

/* meter */
.meter{height:6px;border-radius:3px;background:var(--rule);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.ok i{background:var(--good)} .meter.warn i{background:var(--warn)} .meter.bad i{background:var(--bad)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.neutral{background:var(--card-2);color:var(--ink-2);border:1px solid var(--rule)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}

.tblhd{margin-bottom:10px}
/* filter bar */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters select,.filters input{width:auto;min-width:120px}
.chip{font-size:.76rem;padding:4px 10px;border-radius:99px;border:1px solid var(--rule-2);
  background:var(--card);cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:600}

/* table */
.tblwrap{overflow-x:auto;border-radius:8px;border:1px solid var(--rule);background:var(--card);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:940px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:middle}
thead th{font-size:.67rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;background:var(--card-2);position:sticky;top:0;z-index:2;cursor:pointer;white-space:nowrap}
thead th:hover{color:var(--ink)}
thead th .arr{opacity:.45;font-size:.7em}
td.n,th.n{text-align:right}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--card-2)}
tbody tr.open{background:var(--accent-soft)}
tr.detail>td{padding:0;background:var(--card-2)}
tr.detail.hidden{display:none}
.objname{font-family:var(--serif);font-weight:600;font-size:.98rem;line-height:1.25}
.objmeta{font-size:.72rem;color:var(--ink-3)}
/* Objekt-Titelzeile: eigene Zeile ueber den Kennzahlen, Name links, Lage-Kurzbeschreibung
   rechts daneben (statt vorher in derselben gedraengten Zeile wie die Zahlenspalten). */
.objtitle-cell{border-bottom:none!important;padding-bottom:2px!important}
.objrow{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.objrow .objname{flex:0 1 auto}
.objrow .objmeta{flex:1 1 auto;min-width:0;text-align:right}
#tbl td.n .num{white-space:nowrap}
.val-good{color:var(--good);font-weight:700}
.val-warn{color:var(--warn);font-weight:700}
.val-bad{color:var(--bad);font-weight:700}

/* detail */
.det{padding:16px;border-top:2px solid var(--accent)}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--rule);margin-bottom:14px}
.tab{border:0;background:transparent;border-bottom:2px solid transparent;border-radius:0;
  padding:7px 12px;font-size:.82rem;color:var(--ink-2);font-weight:600}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover{background:transparent;color:var(--ink);border-color:transparent;border-bottom-color:var(--rule-2)}
.tab[aria-selected="true"]:hover{border-bottom-color:var(--accent)}
.tabpane[hidden]{display:none}
/* Kasten-Raster: erst ab ~340px echter Platz fuer Label + Wert nebeneinander --
   darunter lieber einspaltig als zwei gequetschte Spalten mit umbrechenden Labels. */
.detgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
/* Bewertung: dafür|dagegen als breites Paar, darunter Checkliste (breit) neben
   Sanierungsrisiko (schmaler), Notiz volle Breite. Flex statt Raster wegen der
   ungleichen Spalten in Reihe 2. */
.bewgrid{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.bewgrid>.box{flex:1 1 380px;min-width:0}
.bewgrid>.box.wide{flex:2 1 460px}
.bewgrid>.box.narrow{flex:1 1 280px}
.bewgrid>.box.full{flex:1 1 100%}
.box{background:var(--card);border:1px solid var(--rule);border-radius:7px;padding:12px;min-width:0}
.box h4{margin:0 0 8px;font-family:var(--sans);font-size:.7rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);font-weight:700}
.mini{width:100%;min-width:0;font-size:.8rem}
.mini th,.mini td{padding:4px 6px}
.mini td.n{white-space:nowrap}   /* Werte nicht umbrechen; Kopfzeilen dürfen */
.mini thead th{position:static;background:transparent;border-bottom:1px solid var(--rule-2)}
.hscroll{overflow-x:auto;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.note{font-size:.78rem;color:var(--ink-2);line-height:1.5}
.note.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:9px 11px;font-weight:500}
.note.badbox{background:var(--bad-bg);color:var(--bad);border-radius:6px;padding:9px 11px;font-weight:500}
.note.goodbox{background:var(--good-bg);color:var(--good);border-radius:6px;padding:9px 11px;font-weight:500}
/* Aufzähl- und Checklisten teilen sich das Layout: Zeile = flex, Text nimmt den Platz,
   das ✕ steht rechtsbündig in einer Spalte (galt vorher nur für ul.checks). */
ul.bullets,ul.checks{list-style:none;margin:0;padding:0;font-size:.81rem;line-height:1.5}
ul.bullets li,ul.checks li{display:flex;gap:8px;align-items:flex-start;padding:4px 0;border-bottom:1px dotted var(--rule)}
ul.bullets li:last-child,ul.checks li:last-child{border-bottom:0}
ul.bullets .txt,ul.checks .txt{flex:1;min-width:0}
ul.bullets li>button,ul.checks li>button{flex:none;margin-top:1px}
ul.checks input[type=checkbox]{width:auto;margin-top:2px;accent-color:var(--accent);flex:none}
ul.checks li.done .txt{text-decoration:line-through;color:var(--ink-3)}
.addrow{display:flex;gap:6px;margin-top:8px}
.addrow input{flex:1}
/* Finanzierungsbausteine-Tabelle: inaktive Zeile ausgegraut, Radio/Checkbox schmal */
.baustein-off{opacity:.45}
tr.baustein-off input[type=text]{color:var(--ink-3)}
.mini td input[type=radio],.mini td input[type=checkbox]{width:auto;margin:0;accent-color:var(--accent)}
/* zwei Blöcke nebeneinander in einem Kasten (BHW-Eingaben+Wirkung, Hebel-Tabelle+Text),
   bricht auf schmalen Screens untereinander */
.splitrow{display:flex;flex-wrap:wrap;gap:12px 34px;align-items:flex-start}
.splitrow>.hscroll,.splitrow>table{flex:0 1 auto}
.splitrow>.note{flex:1 1 240px;min-width:0}
.mini.kv{width:auto}
.mini.kv td:first-child{padding-right:24px}

/* modal */
dialog{border:1px solid var(--rule);border-radius:10px;background:var(--card);color:var(--ink);
  padding:0;max-width:min(720px,94vw);width:100%;box-shadow:0 12px 48px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(20,26,22,.5)}
.dlg-hd{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--rule)}
.dlg-hd h2{margin-right:auto}
.dlg-bd{padding:16px;max-height:min(68vh,620px);overflow-y:auto}
.dlg-ft{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--rule)}
fieldset{border:1px solid var(--rule);border-radius:7px;padding:11px 12px 13px;margin:0 0 13px}
legend{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:0 5px}

.empty{text-align:center;padding:44px 20px;color:var(--ink-3)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:99;
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:99px;font-size:.83rem;
  box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.foot{font-size:.75rem;color:var(--ink-3);padding:22px 0 0;line-height:1.6;border-top:1px solid var(--rule);margin-top:26px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.print-h{display:none}
.print-cols{display:none}
@media print{
  .basis,.mast-actions,.filters,button,.panel,.addrow,.tblhd{display:none!important}
  body{background:#fff}
  /* Echte Kopfzeile weg -- sie wiederholt sich sonst auf jeder Seite und steht
     über dem Objektnamen. Stattdessen eine Spaltenbeschriftung pro Objekt,
     direkt zwischen Name und Werten (siehe .print-cols in renderTable). */
  #thead{display:none!important}
  .print-cols{display:table-row!important}
  .print-cols td{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-3);font-weight:700;border-top:none;border-bottom:1px solid var(--ink);
    padding:2px 10px 3px;white-space:nowrap}
  .objtitle-tr td,.print-cols td{break-after:avoid}
  /* thead th ist fuers Scrollen am Bildschirm sticky -- beim Drucken bricht das
     nachweislich (Chrome-Bug-Klasse, wie das Grid-Fragmentieren weiter unten):
     eine sticky-Kopfzeile "verrutscht" ueber Seiten hinweg an eine falsche Stelle
     im Fluss. Beim Drucken wird nie gescrollt, sticky wird daher komplett abgeschaltet. */
  thead th{position:static!important}
  /* Objekt-Titelzeile: im Druck reicht Name in eigener Zeile, Lage direkt darunter
     (rechtsbuendig, siehe .objrow .objmeta oben) -- kein Nebeneinander wie am Bildschirm.
     .objname/.objmeta sind <span> (inline) -- als Flex-Items standen sie automatisch
     untereinander, als reine Bloecke im display:block-Elternteil aber nicht von allein:
     erst display:block auf den Spans selbst erzwingt den Zeilenumbruch (per PDF-Test
     gefunden -- ohne das liefen Name und Lage in einer Zeile zusammen). */
  .objrow{display:block!important}
  .objrow .objname{display:block!important}
  .objrow .objmeta{display:block!important;text-align:right;margin-top:1px}
  /* .tblwrap hat overflow-x:auto (fuer die 16-Objekte-Ansicht am Bildschirm) --
     im Druck kann niemand scrollen, "versteckte" Spalten fielen dadurch komplett
     weg (Status, Depot-Huerde). Tabelle bekommt volle Breite, nichts mehr geclippt. */
  .tblwrap{box-shadow:none;break-inside:avoid;overflow-x:visible!important;width:100%}
  #tbl{width:100%;table-layout:auto}
  tr.detail.hidden{display:table-row}
  /* .rail (Meine Lage/Stresstest) ist per .panel schon leer, aber .cols reservierte
     ihre 300px-Spalte trotzdem -- ganzer Bericht lief dadurch nach rechts verschoben
     und beschnitten. Auf Papier eine Spalte, volle Breite. */
  .cols{display:block!important}
  .tabs{display:none!important}
  .tabpane[hidden]{display:block!important}
  .tabpane{margin-bottom:0}
  .print-h{display:block!important;font-size:1rem;margin:6px 0 6px;padding-top:4px;
    border-top:2px solid var(--ink);break-before:auto}
  .print-h:first-child{border-top:none;padding-top:0;margin-top:0}
  /* Kapitel-Einteilung: Eckdaten / Cashflow / Zielpreis+Finanzierung zusammen /
     Bewertung sollen je auf einer eigenen Seite stehen. Bewusst NUR break-after,
     kein break-inside:avoid-page auf der ganzen Rubrik -- das riss frueher die
     komplette Rubrik auf eine neue, sonst leere Seite statt Seite 1 zu fuellen.
     Cashflow bekommt jetzt eine eigene Seite (statt mit Zielpreis geteilt), weil
     der volle Tilgungsplan im Druck ausgeklappt ist (siehe beforeprint-Listener)
     und dadurch deutlich laenger wird -- Zielpreis teilt sich die Seite stattdessen
     mit Finanzierung. */
  .tabpane[data-pane="eck"]{break-after:page}
  .tabpane[data-pane="cf"]{break-after:page}
  .tabpane[data-pane="fin"]{break-after:page}
  /* CSS-Grid bricht beim Drucken nachweislich unzuverlaessig um (Chrome-Bug-Klasse:
     Grid-Container fragmentieren nicht sauber über Seitengrenzen -- einzelne Zellen
     blieben deshalb leer). Flexbox mit Umbruch fragmentiert zuverlaessiger: zwei
     Kaesten je Reihe, volle Spaltenbreite statt schmal und mit Luecke. Kaesten mit
     grid-column:1/-1 (Darlehensvergleich, Verlauf) bekommen ueber flex-basis:100%
     weiterhin die volle Zeile fuer sich. */
  .detgrid,.bewgrid{display:flex!important;flex-wrap:wrap!important;gap:14px!important}
  .detgrid>.box,.bewgrid>.box{flex:1 1 calc(50% - 7px);min-width:0;margin-bottom:0;break-inside:avoid-page}
  /* Bewertung im Druck: Checkliste (lang) und Notiz volle Breite, Rest 2 je Reihe. */
  .bewgrid>.box.wide,.bewgrid>.box.full{flex-basis:100%!important;break-inside:auto}
  /* Volle-Breite-Kaesten (Verlauf, Darlehensvergleich) duerfen laenger als eine Seite
     werden (Verlauf mit ausgeklapptem vollen Tilgungsplan z.B. 40+ Zeilen) -- mit
     break-inside:avoid-page von oben wuerde Chrome den ganzen Kasten auf eine neue,
     erst mal leere Seite schieben und ihn DANACH doch aufreissen muessen, weil er
     immer noch nicht auf eine einzelne Seite passt. Ergebnis waere eine sinnlos
     halbleere Seite plus derselbe Umbruch eine Seite spaeter. break-inside:auto laesst
     die Tabelle stattdessen dort weiterlaufen, wo noch Platz ist. */
  .detgrid>.box[style*="grid-column"]{flex-basis:100%!important;break-inside:auto}
  /* Engere Zeilen -- weniger Umbrueche auf zwei Zeilen bei kurzen Werten. */
  .stat{padding:3px 0!important}
  .box{padding:10px 12px!important}
  /* Verlauf- und aehnliche Tabellen sitzen in einem un-klassifizierten
     overflow-x:auto-Wrapper (wie .hscroll, nur ohne die Klasse) -- im Druck genauso
     sichtbar-los behandeln: nichts darf beim Scrollen-koennen-wir-nicht verschwinden. */
  [style*="overflow-x:auto"]{overflow-x:visible!important}
  .hscroll{overflow-x:visible!important}
  /* Eingabefelder mit echtem Wert (Darlehensvergleich-Varianten, Notiz) als Klartext
     statt als Formularkasten -- Eingabezeilen zum Hinzufuegen sind oben schon per
     .addrow ausgeblendet. */
  input,textarea{border:none!important;background:transparent!important;

<script>
"use strict";
const KEY="immocockpit.v1";
const nf=(d=0)=>new Intl.NumberFormat("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d});
const eur=(v,d=0)=>isFinite(v)?nf(d).format(v)+" €":"–";
const eurM=v=>isFinite(v)?nf(0).format(Math.round(v))+" €":"–";
const pct=(v,d=2)=>isFinite(v)?nf(d).format(v)+" %":"–";
const num=(v,d=1)=>isFinite(v)?nf(d).format(v):"–";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* Eingaben in deutscher Schreibweise lesen: „326.000“, „1.234,56“, „3,57“.
   Ohne das liest JavaScript „326.000“ als 326. Rückgabe NaN, wenn nichts Zahlhaftes drinsteht. */
function numDE(s){
  if(typeof s==="number") return s;
  let t=String(s??"").trim().replace(/[\s €%]/g,"");
  if(!t) return NaN;
  const komma=t.lastIndexOf(","), punkt=t.lastIndexOf(".");
  if(komma>-1&&punkt>-1){
    // beide vorhanden: das hintere Zeichen ist das Dezimaltrennzeichen
    if(komma>punkt) t=t.replace(/\./g,"").replace(",",".");
    else t=t.replace(/,/g,"");
  } else if(komma>-1){
    t=t.replace(/\./g,"").replace(",",".");
  } else if(punkt>-1){
    // nur Punkte: Tausenderpunkt, wenn danach genau drei Ziffern folgen („326.000“)
    if(/^-?\d{1,3}(\.\d{3})+$/.test(t)) t=t.replace(/\./g,"");
  }
  const v=parseFloat(t);
  return isFinite(v)?v:NaN;
}
const uid=()=>Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- Rechenbasis ---------- */
const BASIS_DEF={
  zins:3.8, tilgung:2.0, zinsbindung:10, anschlusszins:5.0,
  steuersatz:44, mietausfall:2, ihRuecklage:10,

};
const BASIS_KNOBS=[

  {k:"tilgung",l:"Tilgung",u:"%",s:.5},
  {k:"steuersatz",l:"Grenzsteuer",u:"%",s:1,t:"44 % real (42 % + 8 % KiSt Bayern, kein Soli) — nicht die 48 % der Excel-Tools."},
  {k:"depotRendite",l:"Depot p.a.",u:"%",s:.5,t:"Vergleichsanlage. Bestimmt die Hürde, die das Objekt schlagen muss."},
  {k:"wertsteigerung",l:"Wertsteig.",u:"%",s:.5},
  {k:"horizont",l:"Horizont",u:"J",s:1},
  {sep:1},
  {k:"zinsbindung",l:"Bindung",u:"J",s:1},
  {k:"anschlusszins",l:"Anschluss",u:"%",s:.25},
  {k:"mietsteigerung",l:"Miete p.a.",u:"%",s:.5},
  {k:"ihRuecklage",l:"IH-Rückl.",u:"€/m²a",s:1,t:"Eigene Rücklage fürs Sondereigentum, zusätzlich zur WEG-Rücklage."},
  {k:"mietausfall",l:"Ausfall",u:"%",s:.5},

/* ---------- Profil ----------

};
/* BHW-Felder sind hier nur die Vorgaben ("mein Bausparvertrag"). Ob und mit welchen

  {k:"liquidesEK",l:"Liquides EK",u:"€"},
  {k:"depot",l:"Depotwert",u:"€"},
  {k:"bhwGuthaben",l:"BHW-Guthaben (zählt als EK)",u:"€"},
  {k:"bhwDarlehen",l:"BHW-Darlehen",u:"€"},
  {k:"bhwZins",l:"BHW-Zins",u:"%",d:2},
  {k:"bhwRate",l:"BHW-Rate",u:"€/M"},
  {k:"bhwLaufzeit",l:"BHW-Laufzeit",u:"J"},
  {k:"ueberschuss",l:"Haushaltsüberschuss",u:"€/M"},

  {k:"eigeneWarmmiete",l:"Eigene Warmmiete",u:"€/M"}

/* ---------- Objekt-Vorlage ---------- */
const OBJ_DEF=()=>({
  id:uid(), name:"Neues Objekt", strasse:"", plz:"", ort:"Freising", lage:"", status:"pruefen",
  kaufpreis:250000, stellplatzpreis:0, zusatzkosten:0, provision:3.57,
  wohnflaeche:60, zimmer:2, etage:"", baujahr:null, sanierung:null, einheiten:null, mea:null,
  energieklasse:"", energiebedarf:null, heizung:"", aufzug:false, balkon:false, stellplatz:false,
  hausgeld:0, hausgeldNU:0, verwaltung:30, ruecklageWEG:null,
  vermietet:false, istMiete:0, stellplatzMiete:0, marktmieteQm:14, mietmodell:"markt",
  gebaeudeanteil:70, ekEinsatz:null, ekAuto:true,

  bausteine:[
    {key:"bhw",name:"BHW",on:false,haupt:false,betrag:null,zins:null,tilgung:null,rate:null,laufzeit:null},
    {key:"haupt",name:"Hauptdarlehen",on:true,haupt:true,betrag:null,zins:null,tilgung:null,rate:null,laufzeit:null}
  ],
  staerken:[], schwaechen:[], fragen:[], massnahmen:[], notiz:"",
  geschaetzt:[]
});
/* Felder, die als Schätzung/Annahme markierbar sind (Checkbox im Bearbeiten-Dialog,
   Markierung in Anzeige + Export). Bewusst nur die, die tatsächlich geschätzt werden —
   nicht jedes Feld, das waere reine UI-Unordnung ohne Nutzen. */
const GESCHAETZT_FELDER=[
  {k:"hausgeld",l:"Hausgeld"}, {k:"hausgeldNU",l:"davon n.u."},
  {k:"istMiete",l:"Ist-Miete"}, {k:"marktmieteQm",l:"Marktmiete"}, {k:"ruecklageWEG",l:"Rücklage"}
];
const STATUS={
  favorit:{l:"Favorit",c:"good"}, pruefen:{l:"In Prüfung",c:"accent"},
  besichtigung:{l:"Besichtigung",c:"warn"}, angebot:{l:"Angebot",c:"warn"},
  verworfen:{l:"Verworfen",c:"bad"}, weg:{l:"Nicht verfügbar",c:"neutral"}
};

/* ================= RECHENKERN ================= */
function afaSatzFor(o){ return (o.baujahr && o.baujahr<1925)?2.5:2.0; }

/* Finanzierungsbausteine: o.bausteine = [{key,name,on,haupt,betrag,zins,tilgung,rate,laufzeit}].
   - haupt:true -> "Restfinanzierer": Betrag = Gesamtinvestition - EK - Summe der übrigen Bausteine.
     Genau einer aktiver Baustein ist haupt.
   - betrag gesetzt -> Fixbetrag-Baustein (BHW, KfW, ...). rate gesetzt -> feste Monatsrate,
     sonst Annuität aus zins+tilgung.
   - key "bhw" ist besonders: Vorgaben aus dem Profil, sein Guthaben zählt als EK.
   bausteineFor() liefert die aufgelöste Liste (mit Profil-Defaults, genau ein haupt) und
   migriert altdaten (o.bhw / o.varianten) rein lesend -- geschrieben wird erst beim Edit. */
function bausteineFor(o){
  const d=S.profil||{}, g=S.basis||{};
  let list = (o.bausteine && o.bausteine.length) ? o.bausteine.map(b=>({...b})) : null;
  if(!list){
    const alt=(o&&o.bhw)||{};
    const bhwOn=!!alt.on;
    list=[
      {key:"bhw",name:"BHW",on:bhwOn,haupt:false,
       betrag:alt.betrag??null,zins:alt.zins??null,tilgung:null,rate:alt.rate??null,laufzeit:alt.laufzeit??null},
      {key:"haupt",name:"Hauptdarlehen",on:true,haupt:true,
       betrag:null,zins:null,tilgung:null,rate:null,laufzeit:null},
      ...((o&&o.varianten)||[]).map(v=>({key:uid(),name:v.name||"Variante",on:false,haupt:false,
       betrag:null,zins:+v.zins||null,tilgung:+v.tilgung||null,rate:null,laufzeit:v.laufzeit??null}))
    ];
  }
  list.forEach(b=>{
    if(b.key==="bhw"){
      if(b.betrag==null||b.betrag==="")   b.betrag=+d.bhwDarlehen||0;
      if(b.zins==null||b.zins==="")       b.zins=+d.bhwZins||0;
      if(b.rate==null||b.rate==="")       b.rate=+d.bhwRate||0;
      if(b.laufzeit==null||b.laufzeit==="")b.laufzeit=+d.bhwLaufzeit||12;
    }
    if(b.haupt){
      if(b.zins==null||b.zins==="")       b.zins=+g.zins||0;
      if(b.tilgung==null||b.tilgung==="") b.tilgung=+g.tilgung||0;
    }
  });
  // genau ein haupt (bevorzugt ein aktiver, sonst der erste)
  if(list.filter(b=>b.haupt).length!==1){
    list.forEach(b=>b.haupt=false);
    const pick=list.find(b=>b.on&&(b.betrag==null||b.betrag===0))||list.find(b=>b.on)||list[0];
    if(pick) pick.haupt=true;
  }
  return list;
}
/* Monatsrate eines Bausteins (haupt bekommt den Restbetrag als Argument) */
function bausteinRateM(b,restBetrag){
  const betr=b.haupt?(+restBetrag||0):(+b.betrag||0);
  if(betr<=0) return 0;
  if(b.rate>0 && !b.haupt) return +b.rate;
  return betr*((+b.zins||0)+(+b.tilgung||0))/100/12;
}
/* Bausteine dauerhaft an das Objekt schreiben (beim ersten Edit) und Altfelder entfernen */
function ensureBausteine(o){
  if(!o.bausteine || !o.bausteine.length){
    o.bausteine=bausteineFor(o);
    delete o.bhw; delete o.varianten;
  }
  return o.bausteine;
}

function basis(o,g){
  const kpGesamt=(+o.kaufpreis||0)+(+o.stellplatzpreis||0);
  const knkSatz=((+g.grest||0)+(+g.notar||0)+(+g.grundbuch||0)+(+o.provision||0))/100;
  const knk=kpGesamt*knkSatz;
  const gi=kpGesamt+knk+(+o.zusatzkosten||0);
  const kalt=o.vermietet?(+o.istMiete||0):((+o.marktmieteQm||0)*(+o.wohnflaeche||0));
  const marktKalt=(+o.marktmieteQm||0)*(+o.wohnflaeche||0);
  const spm=+o.stellplatzMiete||0;
  const miete=kalt+spm, marktMiete=marktKalt+spm;
  const jahresmiete=miete*12;
  const hgNU=+o.hausgeldNU||0;
  const eigeneIH=(+o.wohnflaeche||0)*(+g.ihRuecklage||0)/12;
  const ausfall=miete*(+g.mietausfall||0)/100;
  const nettoMiete=miete-hgNU-eigeneIH-ausfall;
  // Finanzierungsbausteine: Fixbetrag-Bausteine + genau ein Hauptdarlehen (= Restsumme).
  const bausteine=bausteineFor(o);
  const aktiv=bausteine.filter(b=>b.on);
  const guthaben=aktiv.some(b=>b.key==="bhw")?(+S.profil.bhwGuthaben||0):0;
  const ekCash=o.ekAuto?knk:(+o.ekEinsatz||0);
  const ek=ekCash+guthaben;
  const fix=aktiv.filter(b=>!b.haupt);
  const fixSumme=fix.reduce((s,b)=>s+(+b.betrag||0),0);
  const hauptB=aktiv.find(b=>b.haupt)||null;
  const hZins=hauptB?(+hauptB.zins||0):(+g.zins||0);
  const hTilg=hauptB?(+hauptB.tilgung||0):(+g.tilgung||0);
  const darlehen=Math.max(0,gi-ek-fixSumme);        // Hauptdarlehen = Restsumme
  const schuldGesamt=darlehen+fixSumme;
  const annuitaet=(hauptB?bausteinRateM(hauptB,darlehen):0)*12;  // Hauptdarlehens-Rate, jährlich
  const zusatzRateM=fix.reduce((s,b)=>s+bausteinRateM(b),0);     // Summe der Fix-Bausteine, monatlich
  const zinsJ1=darlehen*hZins/100 + fix.reduce((s,b)=>s+(+b.betrag||0)*(+b.zins||0)/100,0); // ges. absetzbarer Zins Jahr 1
  // Außenstellplatz = Grund und Boden, nicht abschreibbar
  const bauAnteil=kpGesamt>0?((+o.kaufpreis||0)/kpGesamt):1;
  const afaSatz=afaSatzFor(o);
  const afaBasis=(gi-(+o.zusatzkosten||0))*bauAnteil*(+o.gebaeudeanteil||0)/100;
  const afa=afaBasis*afaSatz/100;
  return {kpGesamt,knk,knkSatz,gi,kalt,miete,marktMiete,jahresmiete,hgNU,eigeneIH,ausfall,
          nettoMiete,ek,ekCash,darlehen,schuldGesamt,zinsJ1,annuitaet,afa,afaSatz,afaBasis,spm,
          bausteine,bausteineAktiv:aktiv,hauptB,hZins,hTilg,guthaben,fixSumme,zusatzRateM};
}

function kennzahlen(o,g){
  const b=basis(o,g);
  const faktorKP=b.jahresmiete>0?b.kpGesamt/b.jahresmiete:NaN;
  const faktorGI=b.jahresmiete>0?b.gi/b.jahresmiete:NaN;
  const brutto=b.kpGesamt>0?b.jahresmiete/b.kpGesamt*100:NaN;
  const netto=b.gi>0?b.nettoMiete*12/b.gi*100:NaN;
  const cfOp=b.nettoMiete-b.annuitaet/12-b.zusatzRateM;
  const stErg=b.jahresmiete-(+o.verwaltung||0)*12-b.zinsJ1-b.afa;
  const steuer=stErg*(+g.steuersatz||0)/100;
  const cfSt=cfOp-steuer/12;
  const hebel=netto-(+g.zins||0);
  // Potenzial bei Marktmiete
  let cfPot=NaN,faktorPot=NaN;
  if(o.vermietet && b.marktMiete>b.miete){
    const p={...o,vermietet:false,marktmieteQm:+o.marktmieteQm};
    const bp=basis(p,g);
    const cfOpP=bp.nettoMiete-bp.annuitaet/12-bp.zusatzRateM;
    const stP=(bp.jahresmiete-(+o.verwaltung||0)*12-bp.zinsJ1-bp.afa)*(+g.steuersatz||0)/100;
    cfPot=cfOpP-stP/12; faktorPot=bp.kpGesamt/bp.jahresmiete;
  }
  return {...b,faktorKP,faktorGI,brutto,netto,cfOp,steuer,cfSt,hebel,cfPot,faktorPot,
          steuerMonat:-steuer/12};
}

/* Tilgungsplan, monatlich gerechnet, jährlich berichtet */
function amortisation(darlehen,zinsP,tilgungP,bindungJ,anschlussP,maxJ=45){
  const out=[]; if(darlehen<=0) return out;
  const rateStart=darlehen*(zinsP+tilgungP)/100/12;
  let rest=darlehen, rate=rateStart, z=zinsP, m=0, jz=0, jt=0;
  while(rest>0.005 && m<maxJ*12){
    m++;
    if(bindungJ>0 && anschlussP!=null && m===bindungJ*12+1){
      z=anschlussP;
      const minRate=rest*(z+0.5)/100/12;
      rate=Math.max(rateStart,minRate);
    }
    const zi=rest*z/100/12;
    let ti=rate-zi;
    if(ti<=0){ out.push({jahr:Math.ceil(m/12),zins:jz,tilgung:jt,rest,zinssatz:z,abbruch:true}); break; }
    if(ti>rest) ti=rest;
    rest-=ti; jz+=zi; jt+=ti;
    if(m%12===0||rest<=0.005){
      out.push({jahr:Math.ceil(m/12),zins:jz,tilgung:jt,rest,zinssatz:z,rate});
      jz=0;jt=0;
    }
  }
  return out;
}

/* Mietpfad: Marktmiete oder Kappungsgrenzen-Leiter (15 %/3 J bis Marktmiete) */
function mietePfad(o,g,jahre){
  const b=basis(o,g), out=[];
  const steig=1+(+g.mietsteigerung||0)/100;
  if(!o.vermietet||o.mietmodell!=="kappung"||b.marktMiete<=b.miete){
    for(let j=1;j<=jahre;j++) out.push(b.miete*Math.pow(steig,j-1));
    return out;
  }
  let m=b.kalt, ziel=b.marktMiete-b.spm, erreicht=false;
  for(let j=1;j<=jahre;j++){
    if(!erreicht && j>1 && (j-1)%3===0){ m=Math.min(ziel,m*1.15); if(m>=ziel-0.5) erreicht=true; }
    else if(erreicht){ m*=steig; }
    out.push(m+b.spm*Math.pow(steig,j-1));
  }
  return out;
}

function projektion(o,g,jahre){
  const b=basis(o,g);
  const N=Math.max(jahre,45);
  const plan=amortisation(b.darlehen,b.hZins,b.hTilg,+g.zinsbindung,+g.anschlusszins,N);
  // Fix-Bausteine: je eigener Plan, feste Rate -> Tilgungssatz herleiten, keine Zinsbindungs-Umstellung.
  // fixPlaene[k][j-1] undefined -> Baustein ist getilgt, seine Rate faellt ab da weg (Knick im CF).
  const fixPlaene=b.bausteineAktiv.filter(x=>!x.haupt).map(x=>{
    const betr=+x.betrag||0; if(betr<=0) return [];
    const tp = x.rate>0
      ? Math.max(0.05, (+x.rate)*12/betr*100-(+x.zins||0))
      : (+x.tilgung||0);
    return amortisation(betr,+x.zins||0,tp,0,null,N);
  });
  const mieten=mietePfad(o,g,jahre);
  const eskK=1+(+g.kostensteigerung||0)/100;
  const rows=[]; let kum=0;
  for(let j=1;j<=jahre;j++){
    const f=Math.pow(eskK,j-1);
    const miete=mieten[j-1]*12;
    const hg=(+o.hausgeldNU||0)*12*f;
    const ih=(+o.wohnflaeche||0)*(+g.ihRuecklage||0)*f;
    const af=miete*(+g.mietausfall||0)/100;
    const p=plan[j-1]||{zins:0,tilgung:0,rest:0,zinssatz:b.hZins};
    let fz=0,ft=0,fr=0;
    fixPlaene.forEach(pl=>{ const e=pl[j-1]||{zins:0,tilgung:0,rest:0}; fz+=e.zins; ft+=e.tilgung; fr+=e.rest; });
    const cfOp=miete-hg-ih-af-p.zins-p.tilgung-fz-ft;
    const stErg=miete-(+o.verwaltung||0)*12*f-p.zins-fz-b.afa;
    const st=stErg*(+g.steuersatz||0)/100;
    const cf=cfOp-st;
    kum+=cf;
    const wert=b.kpGesamt*Math.pow(1+(+g.wertsteigerung||0)/100,j);
    const rest=p.rest+fr;
    rows.push({jahr:j,miete,hg,ih,af,zins:p.zins+fz,tilgung:p.tilgung+ft,zinssatz:p.zinssatz,
      afa:b.afa,steuer:-st,cfOp,cf,kum,rest,wert,ek:wert-rest});
  }
  const laufzeit=plan.length&&plan[plan.length-1].rest<=0.005?plan[plan.length-1].jahr:null;
  return {rows,plan,fixPlaene,laufzeit,b};
}

/* Depot-Hürde: ab welcher Wertsteigerung schlägt das Objekt den Sparplan? */
function depotHuerde(o,g){
  const N=Math.max(1,+g.horizont||10);
  const pr=projektion(o,g,N), b=pr.b;
  const r=(+g.depotRendite||0)/100;
  let depot=b.ek*Math.pow(1+r,N), eingezahlt=b.ek;
  for(const row of pr.rows){
    const zuschuss=Math.max(0,-row.cf);
    eingezahlt+=zuschuss;
    depot+=zuschuss*Math.pow(1+r,N-row.jahr+0.5);
  }
  const gewinn=Math.max(0,depot-eingezahlt);
  const steuersatz=0.26375*0.7; // Abgeltungsteuer, 30 % Teilfreistellung Aktienfonds
  const depotNetto=depot-gewinn*steuersatz;
  const rest=pr.rows.length?pr.rows[pr.rows.length-1].rest:b.schuldGesamt;
  const wertNoetigDepot=depotNetto+rest;
  const wertNoetigBE=eingezahlt+rest;
  const huerde=b.kpGesamt>0?(Math.pow(wertNoetigDepot/b.kpGesamt,1/N)-1)*100:NaN;
  const breakEven=b.kpGesamt>0?(Math.pow(wertNoetigBE/b.kpGesamt,1/N)-1)*100:NaN;
  const wertProg=b.kpGesamt*Math.pow(1+(+g.wertsteigerung||0)/100,N);
  return {N,eingezahlt,depotNetto,rest,huerde,breakEven,
          saldo:(wertProg-rest)-eingezahlt, tilgung:b.schuldGesamt-rest, wertProg};
}

/* Zielpreis per Bisektion */
function zielpreis(o,g,mode,zielFaktor){
  const b0=basis(o,g);
  if(mode==="faktor"){
    const jm=b0.jahresmiete; if(!(jm>0))return NaN;
    return Math.max(0,jm*zielFaktor-(+o.stellplatzpreis||0));
  }
  let lo=1000,hi=Math.max(20000,(+o.kaufpreis||0)*1.6);
  const f=p=>{
    const k=kennzahlen({...o,kaufpreis:p},g);
    return mode==="cf0"?k.cfSt:k.netto-(+g.zins||0);
  };
  if(f(lo)<0) return NaN;
  for(let i=0;i<70;i++){ const mid=(lo+hi)/2; if(f(mid)<0) hi=mid; else lo=mid; }
  return (lo+hi)/2;
}

/* Zeitstempel nur setzen, wenn sich inhaltlich etwas geändert hat — sonst
   gewönne beim Abgleich immer das zuletzt geöffnete Gerät. */
function fp(o){ const c={...o}; delete c.updatedAt; return JSON.stringify(c); }
function initSnap(){
  snap={};
  S.objekte.forEach(o=>snap[o.id]=fp(o));
  snap.__basis=fpMeta(S.basis); snap.__profil=fpMeta(S.profil);
}
function fpMeta(x){ const c={...x}; delete c._ts; return JSON.stringify(c); }
function stamp(){
  const now=Date.now();
  S.objekte.forEach(o=>{ const f=fp(o); if(snap[o.id]!==f){ o.updatedAt=now; snap[o.id]=f; } });
  const b=fpMeta(S.basis);  if(snap.__basis!==b){ S.basis._ts=now;  snap.__basis=b; }
  const p=fpMeta(S.profil); if(snap.__profil!==p){ S.profil._ts=now; snap.__profil=p; }
}
function writeLocal(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ toast("Speichern fehlgeschlagen"); } }

/* ================= SYNC ================= */
function syncCfg(){ const c=S.sync||{}; return {token:(c.token||"").trim(),repo:(c.repo||"").trim(),
  path:(c.path||"immo-objekte.json").trim(),branch:(c.branch||"main").trim()}; }
function syncReady(){ const c=syncCfg(); return !!(c.token&&c.repo.includes("/")&&c.path); }
function payload(){ return {basis:S.basis,profil:S.profil,
  objekte:S.objekte.filter(o=>!o.demo),                 // Beispielobjekt gehört niemandem
  tombstones:S.tombstones||{},syncedAt:Date.now()}; }   // ohne sync/ui — Token bleibt hier

function b64(str){
  const bytes=new TextEncoder().encode(str); let bin="";
  for(let i=0;i<bytes.length;i+=8192) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return btoa(bin);
}
function unb64(s){ return new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0))); }

function ghKopf(){ const c=syncCfg();
  return {Authorization:"token "+c.token, Accept:"application/vnd.github+json"}; }

/* Klartext statt Statuscode — sonst sucht man den Fehler an der falschen Stelle. */
function ghFehler(status){
  if(status===401) return "Token ungültig oder abgelaufen";
  if(status===403) return "Token hat keine Schreibrechte für dieses Repo (Contents: Read and write)";
  if(status===409||status===422) return "Stand im Repo hat sich geändert — nochmal versuchen";
  return "Fehler "+status;
}

async function ghGet(){
  const c=syncCfg(), [owner,repo]=c.repo.split("/");
  const url=`https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(c.path)}`+
            `?ref=${encodeURIComponent(c.branch)}&_=${Date.now()}`;
  const r=await fetch(url,{headers:ghKopf()});
  if(r.status===404){
    // 404 heißt entweder „Datei noch nicht da" oder „Repo gibt es nicht" — das ist ein
    // großer Unterschied: sonst legt der nächste Schreibversuch die Datei irgendwo an.
    const rr=await fetch(`https://api.github.com/repos/${owner}/${repo}`,{headers:ghKopf()});
    if(!rr.ok) throw new Error(`Repo „${c.repo}“ nicht gefunden oder kein Zugriff — Schreibweise besitzer/name prüfen`);
    return {data:null,sha:null};              // Repo da, Datei wird beim ersten Schreiben angelegt
  }
  if(!r.ok) throw new Error("Lesen: "+ghFehler(r.status));
  const j=await r.json();
  return {data:JSON.parse(unb64((j.content||"").replace(/\n/g,""))),sha:j.sha};
}
async function ghPut(data,sha){
  const c=syncCfg(), [owner,repo]=c.repo.split("/");
  const url=`https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(c.path)}`;
  const body={message:"Objektrechner "+new Date().toISOString().slice(0,16).replace("T"," "),
              content:b64(JSON.stringify(data,null,2)),branch:c.branch};
  if(sha) body.sha=sha;
  const r=await fetch(url,{method:"PUT",headers:{...ghKopf(),"Content-Type":"application/json"},
    body:JSON.stringify(body)});
  if(!r.ok) throw new Error("Schreiben: "+(r.status===404
    ? `Repo „${c.repo}“ nicht gefunden oder kein Zugriff` : ghFehler(r.status)));
}

/* Zusammenführen: je Objekt gewinnt der neuere Stand; Tombstones verhindern,
   dass Gelöschtes vom anderen Gerät wieder auftaucht. */
function mergeStates(L,R){
  const tomb={};
  for(const src of [L.tombstones||{},R.tombstones||{}])
    for(const id in src) tomb[id]=Math.max(tomb[id]||0,+src[id]||0);
  const u=o=>+o.updatedAt||0, map={};
  for(const o of (L.objekte||[])) map[o.id]=o;
  for(const o of (R.objekte||[])){ const e=map[o.id]; if(!e||u(o)>u(e)) map[o.id]=o; }
  const neuer=(a,b)=>((+(b||{})._ts||0)>(+(a||{})._ts||0))?b:a;
  return {basis:neuer(L.basis,R.basis), profil:neuer(L.profil,R.profil),
          objekte:Object.values(map).filter(o=>!(tomb[o.id]&&tomb[o.id]>=u(o))),
          tombstones:tomb};
}

let syncing=false, syncTimer=null;
function setSyncBadge(zustand){
  const el=document.getElementById("syncBadge"); if(!el) return;
  const c=S.sync||{};
  const txt={laeuft:"gleicht ab …",ok:"abgeglichen",fehler:"Fehler"}[zustand]||
    (syncReady()?(c.lastSync?"Stand "+new Date(c.lastSync).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}):"bereit"):"aus");
  el.textContent=txt;
  el.className="pill "+(zustand==="fehler"?"bad":zustand==="ok"?"good":syncReady()?"accent":"neutral");
}

async function fullSync(manual,modus){
  if(!syncReady()){ if(manual) toast("Zuerst unter „Sync“ Token und Repo eintragen"); return; }
  if(syncing) return;
  syncing=true; setSyncBadge("laeuft");
  try{
    const {data:remote,sha}=await ghGet();
    // Erster Abgleich auf diesem Gerät und hier steht nur das Beispiel? Dann ist Laden
    // das Richtige — Zusammenführen würde bloß fremde Kennungen verdoppeln.
    // Sobald eigene Objekte da sind, wird normal zusammengeführt, damit nichts verloren geht.
    if(modus!=="push" && modus!=="pull" && !(S.sync||{}).lastSync
       && !S.objekte.some(o=>!o.demo) && remote && (remote.objekte||[]).length) modus="pull";

    let neu;
    if(modus==="push"||!remote)      neu=payload();
    else if(modus==="pull")          neu=remote;
    else                             neu=mergeStates(payload(),remote);
    S.basis={...BASIS_DEF,...(neu.basis||{})};
    S.profil={...PROFIL_DEF,...(neu.profil||{})};
    S.objekte=(neu.objekte||[]).map(o=>({...OBJ_DEF(),...o}));
    if(S.objekte.some(o=>!o.demo)) S.objekte=S.objekte.filter(o=>!o.demo);  // Beispiel tritt ab
    S.tombstones=neu.tombstones||{};
    initSnap();                       // Stempel neu setzen, sonst gilt alles als frisch geändert
    const pl=payload();
    const unchanged=remote && (o=>{const x={...o};delete x.syncedAt;return JSON.stringify(x);})(pl)===(o=>{const x={...o};delete x.syncedAt;return JSON.stringify(x);})(remote);
    if(modus!=="pull" && !unchanged) await ghPut(pl,sha);   // nichts geändert → kein Leer-Commit
    S.sync.lastSync=Date.now();
    writeLocal(); renderAll(); setSyncBadge("ok");
    if(manual) toast(modus==="pull"?"Vom Repo geladen":modus==="push"?"Ins Repo geschrieben":"Abgeglichen");
  }catch(e){
    setSyncBadge("fehler");
    toast("Sync fehlgeschlagen — "+(e.message||"unbekannt"));
  }finally{ syncing=false; }
}
function queueSync(){
  if(!syncReady()||!(S.sync||{}).auto) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>fullSync(false),4000);   // gebündelt, nicht bei jedem Tastendruck
}

  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2400); }

        r.o.vermietet?'<div class="objmeta" style="margin-top:3px">vermietet</div>':""}</td>`;
      const v=r[c.k];
      const cls=c.c&&isFinite(v)?" "+({good:"val-good",warn:"val-warn",bad:"val-bad"}[c.c(v,r)]||""):"";
      return `<td class="${c.n?"n":""}"><span class="num${cls}">${c.f?c.f(v,r):esc(v??"")}</span></td>`;
    }).join("");
    return `<tr class="objtitle-tr ${offen?"open":""}" data-id="${r.o.id}"><td class="objtitle-cell" colspan="${COLS.length}">
        <div class="objrow"><span class="objname">${esc(r.o.name)}</span><span class="objmeta">${esc(r.o.lage||r.o.strasse||"")}</span></div>
      </td></tr>
      <tr class="print-cols">${COLS.map(c=>`<td class="${c.n?"n":""}">${c.l}</td>`).join("")}</tr>
      <tr data-id="${r.o.id}" class="${offen?"open":""}">${cells}</tr>
      <tr class="detail ${offen?"":"hidden"}" data-det="${r.o.id}"><td colspan="${COLS.length}">
      ${offen?detailHTML(r):""}</td></tr>`;
  }).join("");

  tb.querySelectorAll("tr[data-id]").forEach(tr=>tr.addEventListener("click",e=>{
    if(e.target.closest("button,input,select,textarea,a")) return;
    const id=tr.dataset.id, i=S.ui.offen.indexOf(id);
    if(i>=0) S.ui.offen.splice(i,1); else S.ui.offen.push(id);
    save(); renderTable(); bindDetail();
  }));
  bindDetail();
  document.getElementById("emptyState").innerHTML=rows.length?"":
    '<div class="empty">Keine Objekte in dieser Auswahl. <br>Filter zurücksetzen oder ein Objekt anlegen.</div>';
}

    const d=isFinite(p)?(p-o.kaufpreis)/o.kaufpreis*100:NaN;

  let manBlock="";

        <tr><td>CF nach Steuern</td><td class="n"><span class="num ${k.cfSt>=0?"val-good":"val-bad"}">${eurM(k.cfSt)}/M</span></td></tr>
        <tr><td>Depot-Hürde</td><td class="n"><span class="num ${dh.huerde<=1?"val-good":"val-warn"}">${pct(dh.huerde,2)} p.a.</span></td></tr>
        <tr><td>Nachlass gegenüber Angebot</td><td class="n"><span class="num">${eur(o.kaufpreis-man)} (${num((man-o.kaufpreis)/o.kaufpreis*100,1)} %)</span></td></tr>
      </tbody></table></div>`;
  }
  return `<div class="detgrid">
    <div class="box" style="grid-column:1/-1"><h4>Was muss der Preis tun?</h4>
      <table class="mini"><thead><tr><th>Ziel</th><th class="n">Kaufpreis Wohnung</th><th class="n">Δ zum Angebot</th></tr></thead>

        ${zeile("Hebel neutral",zHe,"Nettomietrendite = Sollzins "+num(g.zins,2)+" %")}
        ${zeile("Cashflow ausgeglichen",zCf,"CF nach Steuern = 0 €/M")}
      </tbody></table>
      <p class="note" style="margin-top:9px">Angebotspreis Wohnung: <strong>${eur(o.kaufpreis)}</strong>${
        o.stellplatzpreis?" + "+eur(o.stellplatzpreis)+" Stellplatz":""}.
        Die Zielpreise beziehen sich auf die Wohnung; Nebenkosten und Eigenkapital rechnen automatisch mit.</p>
      <div class="addrow" style="max-width:340px">
        <input type="text" inputmode="decimal" placeholder="eigener Zielpreis" value="${isFinite(man)?man:""}"

      <ul class="bullets">
        <li>Kaufnebenkosten ${pct(r.knkSatz*100)} = ${eur(r.knk)} — ${o.provision>0?

          "provisionsfrei, das ist bereits ein Vorteil von rund "+eur(r.kpGesamt*0.0357)+" gegenüber 3,57 %."}</li>

      </ul></div>
  </div>`;

function paneFin(r){
  const o=r.o,g=S.basis;
  const bl=r.bausteine;
  const pr=projektion(o,g,Math.max(+g.horizont||10,1));
  const hauptFehlt=!bl.some(b=>b.on&&b.haupt);
  const rateGes=r.annuitaet/12+r.zusatzRateM;
  const rM=x=>x.haupt?r.annuitaet/12:bausteinRateM(x);
  const planFor=x=>{
    if(!x.on) return [];
    if(x.haupt) return pr.plan;
    const betr=+x.betrag||0; if(betr<=0) return [];
    const tp = x.rate>0 ? Math.max(0.05,(+x.rate)*12/betr*100-(+x.zins||0)) : (+x.tilgung||0);
    return amortisation(betr,+x.zins||0,tp,0,null,45);
  };
  const zeile=x=>{
    const pl=planFor(x), rest10=(pl[9]||{}).rest, zinsGes=pl.reduce((s,p)=>s+p.zins,0);
    return `<tr class="${x.on?"":"baustein-off"}">
    <td class="n"><input type="radio" name="bhaupt-${o.id}" ${x.haupt?"checked":""} data-act="bhaupt" data-id="${o.id}" data-k="${x.key}" title="Hauptdarlehen — Betrag = Restsumme"></td>
    <td class="n"><input type="checkbox" ${x.on?"checked":""} data-act="btoggle" data-id="${o.id}" data-k="${x.key}"></td>

        <p class="note" style="margin:0;align-self:center">Variiert nur das Bar-Eigenkapital, mit dem aktuellen

function paneBew(r){
  const o=r.o;
  const mea=o.mea||(o.einheiten?100/o.einheiten:null);
  const sumV=(o.massnahmen||[]).reduce((s,m)=>s+(+m.v||0),0);
  const sumB=(o.massnahmen||[]).reduce((s,m)=>s+(+m.b||0),0);
  const anteilV=mea?sumV*mea/100:null, anteilB=mea?sumB*mea/100:null;
  const deckung=(o.ruecklageWEG&&mea)?o.ruecklageWEG*mea/100:null;
  const offen=(o.fragen||[]).filter(f=>!f.d).length;
  return `<div class="bewgrid">
    <div class="box"><h4>Spricht dafür</h4>
      <ul class="bullets">${(o.staerken||[]).map((s,i)=>
        `<li><span class="txt">${esc(s)}</span><button class="tiny ghost" data-act="rm" data-list="staerken" data-id="${o.id}" data-i="${i}" title="entfernen">✕</button></li>`).join("")||"<li><span class='txt'>–</span></li>"}</ul>
      <div class="addrow"><input placeholder="Stärke ergänzen" data-add="staerken" data-id="${o.id}">
        <button class="tiny" data-act="add" data-list="staerken" data-id="${o.id}">+</button></div>
    </div>
    <div class="box"><h4>Spricht dagegen</h4>
      <ul class="bullets">${(o.schwaechen||[]).map((s,i)=>
        `<li><span class="txt">${esc(s)}</span><button class="tiny ghost" data-act="rm" data-list="schwaechen" data-id="${o.id}" data-i="${i}" title="entfernen">✕</button></li>`).join("")||"<li><span class='txt'>–</span></li>"}</ul>
      <div class="addrow"><input placeholder="Schwäche ergänzen" data-add="schwaechen" data-id="${o.id}">
        <button class="tiny" data-act="add" data-list="schwaechen" data-id="${o.id}">+</button></div>
    </div>
    <div class="box wide"><h4>Vor der Besichtigung klären <span class="pill ${offen?"warn":"good"}">${offen} offen</span></h4>
      <ul class="checks">${(o.fragen||[]).map((f,i)=>
        `<li class="${f.d?"done":""}"><input type="checkbox" ${f.d?"checked":""} data-act="chk" data-id="${o.id}" data-i="${i}">
          <span class="txt">${esc(f.t)}</span>
          <button class="tiny ghost" data-act="rm" data-list="fragen" data-id="${o.id}" data-i="${i}" title="entfernen">✕</button></li>`).join("")||"<li>–</li>"}</ul>
      <div class="addrow"><input placeholder="Frage ergänzen" data-add="fragen" data-id="${o.id}">
        <button class="tiny" data-act="add" data-list="fragen" data-id="${o.id}">+</button></div>
    </div>
    <div class="box narrow"><h4>Sanierungsrisiko der WEG</h4>
      ${mea?"":'<p class="note warnbox">Anzahl der Einheiten fehlt — ohne sie ist der Anteil nicht berechenbar. Unter „Daten ändern“ eintragen.</p>'}
      <table class="mini"><thead><tr><th>Maßnahme</th><th class="n">gesamt</th><th class="n">dein Anteil</th><th></th></tr></thead><tbody>
      ${(o.massnahmen||[]).map((m,i)=>`<tr><td>${esc(m.n)}</td>
        <td class="n"><span class="num">${eur(m.v)}–${eur(m.b)}</span></td>
        <td class="n"><span class="num val-warn">${mea?eur(m.v*mea/100)+"–"+eur(m.b*mea/100):"–"}</span></td>
        <td class="n"><button class="tiny ghost" data-act="rmmass" data-id="${o.id}" data-i="${i}">✕</button></td></tr>`).join("")
        ||'<tr><td colspan="4" class="note">Noch keine Maßnahmen erfasst.</td></tr>'}
      ${(o.massnahmen||[]).length?`<tr style="border-top:2px solid var(--rule-2)"><td><strong>Summe</strong></td>
        <td class="n"><span class="num">${eur(sumV)}–${eur(sumB)}</span></td>
        <td class="n"><span class="num val-bad"><strong>${mea?eur(anteilV)+"–"+eur(anteilB):"–"}</strong></span></td><td></td></tr>`:""}
      </tbody></table>
      <div class="addrow" style="flex-wrap:wrap">
        <input placeholder="Maßnahme" data-m="n" style="min-width:120px">
        <input type="text" inputmode="decimal" placeholder="von €" data-m="v" style="max-width:100px">
        <input type="text" inputmode="decimal" placeholder="bis €" data-m="b" style="max-width:100px">
        <button class="tiny" data-act="addmass" data-id="${o.id}">+</button>
      </div>
      ${mea?`<p class="note" style="margin-top:8px">Miteigentumsanteil ${num(mea,1)} %${o.einheiten?` (geschätzt aus ${o.einheiten} Einheiten)`:""}.
        ${deckung!=null?`WEG-Rücklage deckt davon <strong>${eur(deckung)}</strong>.
        ${anteilV&&deckung<anteilV?`<span class="val-bad">Lücke mindestens ${eur(anteilV-deckung)}.</span>`:'<span class="val-good">Rücklage trägt die untere Schätzung.</span>'}`:
        "Rücklagenstand der WEG noch unbekannt."}</p>`:""}
    </div>
    <div class="box full"><h4>Notiz</h4>
      <textarea rows="3" data-field="notiz" data-id="${o.id}" placeholder="Eigene Einschätzung, Gesprächsnotizen, Termine …">${esc(o.notiz)}</textarea>
    </div>
  </div>`;
}

/* Neu zeichnen, ohne dass die Seite springt -- renderTable() baut #tbody komplett
   neu, dabei geht die Scrollposition verloren. Für die Baustein-Interaktionen
   (Häkchen/Radio/Feld) merken wir sie und stellen sie danach wieder her. */
function rerenderKeepScroll(){
  const y=window.scrollY;
  renderTable(); bindDetail();
  window.scrollTo(0,y);
}

/* ================= Detail-Events ================= */
function bindDetail(){
  document.querySelectorAll("[data-detail]").forEach(d=>{
    const id=d.dataset.detail;
    d.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
      d.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t));
      d.querySelectorAll(".tabpane").forEach(p=>p.hidden=(p.dataset.pane!==t.dataset.tab));
      S.ui.tabs=S.ui.tabs||{}; S.ui.tabs[id]=t.dataset.tab; save();
    }));
    d.querySelectorAll("[data-bfield]").forEach(inp=>inp.addEventListener("change",()=>{
      const o=S.objekte.find(x=>x.id===inp.dataset.id); if(!o) return;
      const f=inp.dataset.bfield;
      if(f==="ekcash"){
        const n=numDE(inp.value);
        if(isFinite(n)){ o.ekAuto=false; o.ekEinsatz=n; save(); rerenderKeepScroll(); }
        return;
      }
      ensureBausteine(o);
      const b=o.bausteine.find(x=>x.key===inp.dataset.k); if(!b) return;
      if(f==="name") b.name=inp.value.trim()||"Baustein";
      else { const n=numDE(inp.value); if(isFinite(n)) b[f]=n; }
      save(); rerenderKeepScroll();
    }));
    d.addEventListener("click",e=>{
      const b=e.target.closest("[data-act]"); if(!b) return;
      const o=S.objekte.find(x=>x.id===(b.dataset.id||id)); if(!o) return;
      const act=b.dataset.act;
      if(act==="edit"){ openObjDialog(o); return; }
      if(act==="del"){
        if(confirm(`„${o.name}“ wirklich löschen?`)){
          S.objekte=S.objekte.filter(x=>x.id!==o.id);
          S.ui.offen=S.ui.offen.filter(x=>x!==o.id);
          S.tombstones=S.tombstones||{};
          S.tombstones[o.id]=Date.now();   // sonst holt der nächste Abgleich das Objekt zurück
          delete snap[o.id];
          save(); renderAll(); toast("Objekt gelöscht");
        } return;
      }
      if(act==="add"){
        const list=b.dataset.list, inp=d.querySelector(`[data-add="${list}"][data-id="${o.id}"]`);
        const v=(inp.value||"").trim(); if(!v) return;
        if(list==="fragen") o.fragen.push({t:v,d:false}); else o[list].push(v);
        save(); renderTable(); return;
      }
      if(act==="rm"){ const list=b.dataset.list; o[list].splice(+b.dataset.i,1); save(); renderTable(); return; }
      if(act==="rmmass"){ o.massnahmen.splice(+b.dataset.i,1); save(); renderTable(); return; }
      if(act==="addmass"){
        const box=b.closest(".addrow");
        const n=box.querySelector('[data-m="n"]').value.trim();
        const v=numDE(box.querySelector('[data-m="v"]').value);
        const bb=numDE(box.querySelector('[data-m="b"]').value);
        if(!n||!isFinite(v)) return;
        o.massnahmen.push({n,v,b:isFinite(bb)?bb:v}); save(); renderTable(); return;
      }
      if(act==="badd"){
        ensureBausteine(o);
        const box=b.closest(".addrow");
        const name=box.querySelector('[data-bnew="name"]').value.trim()||"Baustein";
        const zi=numDE(box.querySelector('[data-bnew="zins"]').value);
        const ti=numDE(box.querySelector('[data-bnew="tilgung"]').value);
        o.bausteine.push({key:uid(),name,on:false,haupt:false,betrag:null,
          zins:isFinite(zi)?zi:+S.basis.zins, tilgung:isFinite(ti)?ti:+S.basis.tilgung, rate:null, laufzeit:null});
        save(); rerenderKeepScroll(); return;
      }
      if(act==="bdel"){
        ensureBausteine(o);
        o.bausteine=o.bausteine.filter(x=>x.key!==b.dataset.k);
        if(!o.bausteine.some(x=>x.haupt&&x.on)){ const p=o.bausteine.find(x=>x.on)||o.bausteine[0]; if(p) p.haupt=true; }
        save(); rerenderKeepScroll(); return;
      }
      if(act==="print"){
        S.ui.printOnly=o.id;
        renderTable();
        window.onafterprint=()=>{ S.ui.printOnly=null; renderTable(); window.onafterprint=null; };
        setTimeout(()=>window.print(),50);
        return;
      }
      if(act==="setziel"){
        const inp=d.querySelector(`[data-field="zielpreisManuell"][data-id="${o.id}"]`);
        const v=numDE(inp.value); o.zielpreisManuell=isFinite(v)?v:null; save(); renderTable(); return;
      }
    });
    d.addEventListener("change",e=>{
      const b=e.target.closest('[data-act]'); if(!b) return;
      const act=b.dataset.act;
      const o=S.objekte.find(x=>x.id===b.dataset.id); if(!o) return;
      if(act==="chk"){ o.fragen[+b.dataset.i].d=b.checked; save(); renderTable(); return; }
      if(act==="btoggle"){
        ensureBausteine(o);
        const x=o.bausteine.find(y=>y.key===b.dataset.k); if(x) x.on=b.checked;
        if(!o.bausteine.some(y=>y.haupt&&y.on)){ const p=o.bausteine.find(y=>y.on)||o.bausteine[0]; if(p) p.haupt=true; }
        save(); rerenderKeepScroll(); return;
      }
      if(act==="bhaupt"){
        ensureBausteine(o);
        o.bausteine.forEach(y=>y.haupt=(y.key===b.dataset.k));
        save(); rerenderKeepScroll(); return;
      }
    });
    d.querySelectorAll('[data-field="notiz"]').forEach(t=>{
      t.addEventListener("change",()=>{
        const o=S.objekte.find(x=>x.id===t.dataset.id); if(o){o.notiz=t.value;save();}
      });
    });
    d.querySelectorAll("[data-add]").forEach(i=>i.addEventListener("keydown",e=>{
      if(e.key==="Enter"){ e.preventDefault();
        d.querySelector(`[data-act="add"][data-list="${i.dataset.add}"][data-id="${i.dataset.id}"]`)?.click(); }
    }));
  });
}

      </div>
      <p class="note" style="margin-top:8px">„Nicht umlagefähig“ = Verwaltung + Rücklagenzuführung; nur die Verwaltung
      ist sofort Werbungskosten. Steht der Split noch nicht fest, grob 40–45 % des Hausgelds ansetzen und als offene Frage vermerken.</p>
      <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:11px;padding-top:9px;border-top:1px solid var(--line)">

      </div>
    </fieldset>`,
    body=>{
      const g=n=>body.querySelector(`[name="${n}"]`);
      const numF=["kaufpreis","stellplatzpreis","provision","zusatzkosten","wohnflaeche","zimmer","baujahr",
        "sanierung","einheiten","mea","energiebedarf","hausgeld","hausgeldNU","verwaltung","ruecklageWEG",
        "istMiete","stellplatzMiete","marktmieteQm","gebaeudeanteil","ekEinsatz","zielpreisManuell"];
      const txtF=["name","strasse","plz","ort","lage","status","etage","energieklasse","heizung","mietmodell"];
      const boolF=["vermietet","aufzug","balkon","stellplatz","ekAuto"];
      const t=neu?OBJ_DEF():S.objekte.find(x=>x.id===o.id);
      txtF.forEach(k=>{ if(g(k)) t[k]=g(k).value.trim(); });
      // Unverständliches nicht stillschweigend zu 0 machen: alten Wert behalten und sagen, welches Feld klemmt.
      const unklar=[];
      numF.forEach(k=>{ if(!g(k))return; const val=g(k).value.trim();
        if(val===""){ t[k]=null; return; }
        const z=numDE(val);
        if(isNaN(z)){ unklar.push(`${g(k).closest(".fld")?.querySelector("span")?.textContent||k}: „${val}“`); return; }
        t[k]=z; });
      boolF.forEach(k=>{ if(g(k)) t[k]=g(k).checked; });
      t.geschaetzt=GESCHAETZT_FELDER.map(f=>f.k).filter(k=>g("gs_"+k)?.checked);
      if(!t.name) t.name="Objekt ohne Namen";
      t.demo=false;   // bearbeitet = übernommen, ab jetzt ein echtes Objekt
      if(neu){ S.objekte.push(t); S.ui.offen.push(t.id); }
      save(); renderAll();
      toast(unklar.length
        ? `Nicht als Zahl erkannt, bisheriger Wert behalten — ${unklar.join(" · ")}`
        : (neu?"Objekt angelegt":"Gespeichert"));
    });
}

/* ================= Export / Import ================= */
async function saveFile(filename,data){
  // Innerhalb von claude.ai gibt es einen eigenen Speichern-Dialog, sonst normaler Browser-Download.
  if(window.claude&&window.claude.downloads){
    try{ await window.claude.downloads.save({filename,data}); toast("Gespeichert: "+filename); }
    catch(err){
      const c=err&&err.code;
      if(c==="declined") toast("Abgebrochen");
      else if(c==="rate_limited") toast("Kurz warten und nochmal");
      else if(c==="too_large") toast("Datei zu groß");
      else toast("Speichern nicht möglich");
    }
    return;
  }
  try{
    const url=URL.createObjectURL(new Blob([data],{type:"application/octet-stream"}));
    const a=document.createElement("a");
    a.href=url; a.download=filename; a.style.display="none";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast("Gespeichert: "+filename);
  }catch(e){ toast("Speichern nicht möglich"); }
}
function exportJson(){

function exportMd(){
  const g=S.basis, ks=kzAlle();
  const L=[];
  L.push(`# Objektvergleich — Stand ${new Date().toLocaleDateString("de-DE")}`,"");
  L.push(`**Rechenbasis:** ${num(g.zins,2)} % Zins · ${num(g.tilgung,1)} % Tilgung · ${num(g.steuersatz,0)} % Grenzsteuersatz · `+
    `${num(g.mietausfall,1)} % Mietausfall · ${num(g.ihRuecklage,0)} €/m²a IH-Rücklage · `+
    `GrESt ${num(g.grest,1)} % + Notar ${num(g.notar,1)} % + Grundbuch ${num(g.grundbuch,1)} % · `+
    `Depot-Vergleich ${num(g.depotRendite,1)} %/a · Horizont ${num(g.horizont,0)} Jahre`,"");
  L.push("| Objekt | Ort | Preis | €/m² | Miete | Faktor | Nettorendite | CF n. St. | Depot-Hürde | Status |");
  L.push("|---|---|---|---|---|---|---|---|---|---|");
  ks.forEach(k=>L.push(`| ${k.o.name} | ${k.o.ort} | ${eur(k.kpGesamt)} | ${eur(k.qm)} | ${eur(k.miete)} | `+
    `${num(k.faktorKP,1)} | ${pct(k.netto)} | ${eurM(k.cfSt)}/M | ${pct(k.huerde,2)} p.a. | ${(STATUS[k.o.status]||{}).l} |`));
  L.push("");
  ks.forEach(k=>{
    const o=k.o;
    L.push(`## ${o.name}`,"");
    L.push(`**Status:** ${(STATUS[o.status]||{}).l}  `);
    L.push(`**Lage:** ${[o.strasse,o.plz,o.ort].filter(Boolean).join(" ")}${o.lage?" — "+o.lage:""}`,"");
    L.push(`| | |`,`|---|---|`);
    L.push(`| Kaufpreis | ${eur(o.kaufpreis)}${o.stellplatzpreis?" + "+eur(o.stellplatzpreis)+" Stellplatz":""} = ${eur(k.qm)}/m² |`);
    L.push(`| Fläche / Zimmer / Etage | ${num(o.wohnflaeche,2)} m² / ${num(o.zimmer,1)} / ${o.etage||"–"} |`);
    L.push(`| Baujahr / Sanierung | ${o.baujahr||"unbekannt"} / ${o.sanierung||"–"} |`);
    L.push(`| Energie / Heizung | ${o.energieklasse||"?"}${o.energiebedarf?` (${num(o.energiebedarf,1)} kWh/m²a)`:""} / ${o.heizung||"–"} |`);
    const schaetzMd=f=>(o.geschaetzt||[]).includes(f)?" ⚠️ Schätzung":"";
    L.push(`| Hausgeld | ${eur(o.hausgeld)}${schaetzMd("hausgeld")}/M, davon ${eur(o.hausgeldNU)}${schaetzMd("hausgeldNU")} nicht umlagefähig |`);
    L.push(`| Miete | ${o.vermietet?"Ist "+eur(k.kalt):"Markt "+eur(k.kalt)}${schaetzMd(o.vermietet?"istMiete":"marktmieteQm")}${k.spm?" + "+eur(k.spm)+" Stellplatz":""} = ${eur(k.miete)}/M |`);
    L.push(`| Kaufnebenkosten | ${eur(k.knk)} (${pct(k.knkSatz*100)}) → Gesamtinvestition ${eur(k.gi)} |`);
    L.push(`| Faktor / Bruttorendite / Nettorendite | ${num(k.faktorKP,1)} / ${pct(k.brutto)} / ${pct(k.netto)} |`);
    L.push(`| AfA | ${num(k.afaSatz,1)} % auf ${eur(k.afaBasis)} = ${eur(k.afa)}/a |`);
    L.push(`| **Cashflow nach Steuern** | **${eurM(k.cfSt)}/M** |`);
    L.push(`| Break-even / Depot-Hürde | ${pct(k.breakEven,2)} p.a. / ${pct(k.huerde,2)} p.a. |`,"");
    if(o.staerken.length){L.push("**Spricht dafür**",""); o.staerken.forEach(s=>L.push(`- ${s}`)); L.push("");}
    if(o.schwaechen.length){L.push("**Spricht dagegen**",""); o.schwaechen.forEach(s=>L.push(`- ${s}`)); L.push("");}
    if(o.fragen.length){L.push("**Vor der Besichtigung klären**",""); o.fragen.forEach(f=>L.push(`- [${f.d?"x":" "}] ${f.t}`)); L.push("");}
    if(o.massnahmen.length){
      const mea=o.mea||(o.einheiten?100/o.einheiten:null);
      L.push("**Sanierungsrisiko**","");
      o.massnahmen.forEach(m=>L.push(`- ${m.n}: ${eur(m.v)}–${eur(m.b)} gesamt${mea?` → Anteil ${eur(m.v*mea/100)}–${eur(m.b*mea/100)}`:""}`));
      L.push("");
    }
    if(o.notiz){L.push(`> ${o.notiz}`,"");}
  });
  saveFile(`objektvergleich-${new Date().toISOString().slice(0,10)}.md`,L.join("\n"));
}
function importJson(){
  openDialog("Daten laden",`
    <p class="note">Gesicherte JSON-Datei auswählen oder den Inhalt hier einfügen. Ersetzt den aktuellen Stand.</p>
    <label class="fld" style="margin:11px 0"><span>Datei</span><input type="file" name="file" accept=".json,application/json"></label>
    <label class="fld"><span>oder JSON einfügen</span><textarea name="txt" rows="8" placeholder="{ … }"></textarea></label>`,
    async body=>{
      const f=body.querySelector('[name="file"]').files[0];
      let raw=body.querySelector('[name="txt"]').value.trim();
      if(f) raw=await f.text();
      if(!raw){ toast("Nichts zu laden"); return; }
      try{
        const d=JSON.parse(raw);
        if(!d.objekte) throw new Error("Format");
        S={basis:{...BASIS_DEF,...d.basis},profil:{...PROFIL_DEF,...d.profil},
           objekte:d.objekte.map(o=>({...OBJ_DEF(),...o})),
           tombstones:d.tombstones||{},
           sync:S.sync,                       // Zugang gehört zum Gerät, nicht zur Datei
           ui:{sort:"cfSt",dir:-1,filter:"",ort:"",offen:[],tabs:{},...(d.ui||{})}};
        initSnap(); save(); renderAll(); toast(`${S.objekte.length} Objekte geladen`);
      }catch(e){ toast("Datei nicht lesbar"); }
    });
}

// Notiz-Textareas wachsen im Druck auf ihre volle Hoehe (rows="3" scrollt sonst intern,
// CSS allein reicht nicht -- siehe Kommentar bei @media print). Gilt fuer JEDEN Druck,
// ob ueber den Drucken-Button oder Cmd+P, daher addEventListener statt window.onafterprint
// (das wuerde die printOnly-Logik des Drucken-Buttons ueberschreiben statt ergaenzen).
// <details> (Vollstaendiger Tilgungsplan) soll im Druck immer aufgeklappt sein --
// das CSS-Attribut "open" laesst sich nicht zuverlaessig per CSS erzwingen, daher
// hier zusammen mit dem Textarea-Fix per JS gesetzt und danach zurueckgesetzt.
window.addEventListener("beforeprint",()=>{
  document.querySelectorAll("textarea").forEach(ta=>{
    ta.dataset.printH=ta.style.height;
    ta.style.height="auto";
    ta.style.height=(ta.scrollHeight+2)+"px";
  });
  document.querySelectorAll("details").forEach(d=>{
    d.dataset.wasOpen=d.open?"1":"";
    d.open=true;
  });
});
window.addEventListener("afterprint",()=>{
  document.querySelectorAll("textarea").forEach(ta=>{
    ta.style.height=ta.dataset.printH||"";
    delete ta.dataset.printH;
  });
  document.querySelectorAll("details").forEach(d=>{
    d.open=d.dataset.wasOpen==="1";
    delete d.dataset.wasOpen;
  });
});

initSnap();
renderAll();
setSyncBadge();
if(syncReady()&&(S.sync||{}).auto) fullSync(false);   // beim Öffnen still den neuesten Stand holen
