<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mietspiegel Landshut 2025</title>
<style>
:root{
  --bg:#f4f5f3; --karte:#fff; --rand:#dcdfd8; --text:#1c1f1a; --matt:#6b7065;
  --akzent:#2f5d3f; --akzent-hell:#e6efe8; --warn:#8a3324; --warn-hell:#f6ece9;
  --radius:10px; --schatten:0 1px 2px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#15180f; --karte:#1e2218; --rand:#333a2b; --text:#e9ece3; --matt:#9aa290;
  --akzent:#7fb98f; --akzent-hell:#243326; --warn:#e4967f; --warn-hell:#33231e;
  --schatten:0 1px 2px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#15180f; --karte:#1e2218; --rand:#333a2b; --text:#e9ece3; --matt:#9aa290;
  --akzent:#7fb98f; --akzent-hell:#243326; --warn:#e4967f; --warn-hell:#33231e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 64px}
header{padding:18px 0 14px}
h1{margin:0;font-size:1.3rem;letter-spacing:-.01em}
header p{margin:4px 0 0;color:var(--matt);font-size:.85rem}
section{background:var(--karte);border:1px solid var(--rand);border-radius:var(--radius);
  padding:14px;margin-bottom:14px;box-shadow:var(--schatten)}
h2{margin:0 0 10px;font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;
  color:var(--matt);font-weight:600}
label{display:block;font-size:.8rem;color:var(--matt);margin:0 0 4px}
input,select{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--rand);
  border-radius:8px;background:var(--bg);color:var(--text)}
input:focus,select:focus{outline:2px solid var(--akzent);outline-offset:1px}
.reihe{display:flex;gap:10px}.reihe>div{flex:1}
.feld{margin-bottom:12px}.feld:last-child{margin-bottom:0}
#treffer{list-style:none;margin:6px 0 0;padding:0;max-height:220px;overflow:auto;
  border:1px solid var(--rand);border-radius:8px;display:none;background:var(--karte)}
#treffer li{padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--rand);font-size:.92rem}
#treffer li:last-child{border-bottom:0}
#treffer li:hover,#treffer li[aria-selected=true]{background:var(--akzent-hell)}
.lage{margin-top:12px;padding:12px;border-radius:8px;background:var(--akzent-hell);
  border:1px solid var(--rand)}
.lage.minus{background:var(--warn-hell)}
.lage b{font-size:1.5rem;font-variant-numeric:tabular-nums}
.lage ul{margin:8px 0 0;padding-left:18px;font-size:.84rem;color:var(--matt)}
.merkmal{display:flex;gap:10px;align-items:flex-start;padding:9px 0;
  border-bottom:1px solid var(--rand);cursor:pointer}
.merkmal:last-child{border-bottom:0}
.merkmal input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--akzent)}
.merkmal .txt{flex:1;font-size:.92rem;line-height:1.35}
.merkmal .hint{display:block;color:var(--matt);font-size:.78rem;margin-top:2px}
.pkt{font-variant-numeric:tabular-nums;font-weight:600;font-size:.88rem;flex:none;
  min-width:34px;text-align:right;color:var(--akzent)}
.pkt.neg{color:var(--warn)}
.gruppe{margin-bottom:4px}
.gruppe>h3{margin:14px 0 2px;font-size:.84rem;font-weight:600}
.gruppe:first-child>h3{margin-top:0}
#ergebnis{position:sticky;bottom:0;margin:0 -16px -64px;padding:14px 16px 24px;
  background:var(--karte);border-top:1px solid var(--rand);
  box-shadow:0 -4px 16px rgba(0,0,0,.07)}
.zahl{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0}
.zahl span:first-child{font-size:.85rem;color:var(--matt)}
.zahl span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.zahl.gross span:last-child{font-size:1.45rem;color:var(--akzent)}
.zahl.gross span:first-child{font-size:.9rem;color:var(--text);font-weight:600}
.hinweis{font-size:.78rem;color:var(--matt);margin-top:10px;line-height:1.45}
.leer{color:var(--matt);font-size:.9rem;padding:4px 0}
a{color:var(--akzent)}
.zeile{display:flex;justify-content:space-between;font-size:.85rem;padding:2px 0;
  color:var(--matt)}
.zeile b{color:var(--text);font-variant-numeric:tabular-nums}
</style>
</head>

<div class="wrap">
<header>

<section>

  <div class="reihe">

      <input id="baujahr" type="number" inputmode="numeric" placeholder="1993">
    </div>
  </div>
  <div id="basisbox"></div>
</section>

<section>
  <h2>3 · Merkmale (Tabelle 2)</h2>
  <div id="merkmale"></div>
</section>

</div>

  if (eintrag[3]){
    const key = String(hnr||'').trim().toLowerCase().replace(/\s+/g,'');
    for (const k in eintrag[3]) if (k.toLowerCase() === key) { code = eintrag[3][k]; break; }
  }
  return code;
}

function suche(q){
  const n = norm(q), box = $('#treffer');
  box.innerHTML = ''; box.style.display = 'none';
  if (n.length < 2) return;
  const tr = [];
  for (let i = 0; i < NORM.length && tr.length < 40; i++)
    if (NORM[i].startsWith(n)) tr.push(i);
  if (tr.length < 40)
    for (let i = 0; i < NORM.length && tr.length < 40; i++)
      if (!tr.includes(i) && NORM[i].includes(n)) tr.push(i);
  if (!tr.length) return;
  tr.forEach(i => {
    const li = document.createElement('li');
    li.textContent = ADR[i][0] + '  ·  84' + ADR[i][1];
    li.onclick = () => { gewaehlt = ADR[i]; $('#str').value = ADR[i][0];
      box.style.display = 'none'; $('#nr').focus(); rechne(); speichern(); };
    box.appendChild(li);
  });
  box.style.display = 'block';
}

function zeigeLage(){
  const box = $('#lagebox');
  if (!gewaehlt){ box.innerHTML = ''; return null; }
  const code = lageFuer(gewaehlt, $('#nr').value);
  const p = pktAusCode(code);
  const gruende = LAGE.map(([k,v,t],i) => ((code>>i)&1) ? `${t} <b>${v>0?'+':''}${v} %</b>` : null)
    .filter(Boolean);
  const exakt = gewaehlt[3] && Object.keys(gewaehlt[3]).some(
    k => k.toLowerCase() === String($('#nr').value||'').trim().toLowerCase());
  box.innerHTML = `<div class="lage${p<0?' minus':''}">
    <b>${p>0?'+':''}${p} %</b> Wohnlage
    <ul>${gruende.length ? gruende.map(g=>`<li>${g}</li>`).join('')
      : '<li>keine Zu- oder Abschläge</li>'}</ul>
    <div class="hinweis">${exakt ? 'Wert für diese Hausnummer.'
      : 'Häufigster Wert dieser Straße — bei abweichender Hausnummer kann er um 1 bis 3 Punkte abweichen.'}</div></div>`;
  return p;
}

function basisMiete(flaeche, baujahr){
  if (!flaeche || !baujahr) return null;
  if (flaeche < 35 || flaeche > 135) return {fehler:'Der Mietspiegel gilt nur von 35 bis 135 m².'};
  let zi = T1.grenzen.findIndex((g,i) => i < 9 && flaeche >= g && flaeche < T1.grenzen[i+1]);
  if (flaeche === 135) zi = 8;
  if (zi < 0) return {fehler:'Wohnfläche außerhalb der Tabelle.'};
  const sp = T1.bjGrenzen.findIndex(g => baujahr <= g);
  if (sp < 0) return {fehler:'Baujahr nach 2024 — Mietspiegel nicht anwendbar.'};
  return {wert:T1.werte[zi][sp], zeile:T1.groessen[zi], spalte:T1.baujahre[sp]};
}

function zeigeBasis(){
  const f = parseFloat(String($('#flaeche').value).replace(',','.'));
  const b = parseInt($('#baujahr').value,10);
  const r = basisMiete(f,b), box = $('#basisbox');
  if (!r){ box.innerHTML = ''; return null; }
  if (r.fehler){ box.innerHTML = `<div class="lage minus">${r.fehler}</div>`; return null; }
  box.innerHTML = `<div class="zeile"><span>Tabelle 1 · ${r.zeile} m² · ${r.spalte}</span>
    <b>${eur(r.wert)} €/m²</b></div>`;
  return r.wert;
}

function baueMerkmale(){
  $('#merkmale').innerHTML = T2.map(([titel,items]) => `<div class="gruppe"><h3>${titel}</h3>` +
    items.map(([id,p,t,h]) => `<label class="merkmal">
      <input type="checkbox" data-p="${p}" id="m_${id}">
      <span class="txt">${t}${h?`<span class="hint">${h}</span>`:''}</span>
      <span class="pkt${p<0?' neg':''}">${p>0?'+':''}${p}</span></label>`).join('') +
    '</div>').join('');
  $('#merkmale').addEventListener('change', () => { rechne(); speichern(); });
}

function rechne(){
  const lage = zeigeLage(), basis = zeigeBasis();
  const merk = [...document.querySelectorAll('#merkmale input:checked')]
    .reduce((s,el) => s + (+el.dataset.p), 0);
  const f = parseFloat(String($('#flaeche').value).replace(',','.'));
  const box = $('#ergebnis');
  if (basis === null || lage === null || !f){
    box.innerHTML = '<div class="leer">Adresse, Fläche und Baujahr eingeben.</div>';
    return;
  }
  const pkt = lage + merk;
  const qm = basis * (1 + pkt/100), miete = qm * f;
  box.innerHTML = `
    <div class="zahl"><span>Tabelle 1</span><span>${eur(basis)} €/m²</span></div>
    <div class="zahl"><span>Lage ${lage>0?'+':''}${lage} % · Merkmale ${merk>0?'+':''}${merk} %</span>
      <span>${pkt>0?'+':''}${pkt} %</span></div>
    <div class="zahl gross"><span>Ortsübliche Vergleichsmiete</span>
      <span>${Math.round(miete).toLocaleString('de-DE')} €</span></div>
    <div class="zahl"><span>entspricht</span><span>${eur(qm)} €/m²</span></div>
    <div class="zahl"><span>Mietpreisbremse · § 556d (+10 %)</span>
      <span>${Math.round(miete*(1+BREMSE)).toLocaleString('de-DE')} €</span></div>
    <div class="zahl"><span>Zweidrittel-Spanne ± 22 %</span>
      <span>${Math.round(miete*(1-SPANNE)).toLocaleString('de-DE')} – ${Math.round(miete*(1+SPANNE)).toLocaleString('de-DE')} €</span></div>
    <div class="hinweis">Netto<b>kalt</b>miete ohne Betriebskosten. Die Spanne gilt für den
      Bestand (§ 558); für eine Neuvermietung in Landshut ist die Bremse maßgeblich —
      außer bei Erstbezug nach dem 01.10.2014 (§ 556f). Keine Rechtsberatung.</div>`;
}

function speichern(){
  try{
    const m = {};
    document.querySelectorAll('#merkmale input').forEach(el => m[el.id] = el.checked);
    localStorage.setItem('ms-la', JSON.stringify({
      str:$('#str').value, nr:$('#nr').value, f:$('#flaeche').value,
      b:$('#baujahr').value, m, gi: gewaehlt ? ADR.indexOf(gewaehlt) : -1}));
  }catch(e){}
}
function laden(){
  try{
    const s = JSON.parse(localStorage.getItem('ms-la')||'null');
    if (!s) return;
    $('#str').value = s.str||''; $('#nr').value = s.nr||'';
    $('#flaeche').value = s.f||''; $('#baujahr').value = s.b||'';
    if (s.gi >= 0) gewaehlt = ADR[s.gi];
    for (const k in (s.m||{})){ const el = document.getElementById(k); if (el) el.checked = s.m[k]; }
  }catch(e){}
}

baueMerkmale();
laden();
$('#str').addEventListener('input', e => { gewaehlt = null; suche(e.target.value); rechne(); });
$('#nr').addEventListener('input', () => { rechne(); speichern(); });
['#flaeche','#baujahr'].forEach(s =>
  $(s).addEventListener('input', () => { rechne(); speichern(); }));
document.addEventListener('click', e => {
  if (!e.target.closest('#str') && !e.target.closest('#treffer'))
    $('#treffer').style.display = 'none';
});
rechne();
</script>
</body>
</html>
